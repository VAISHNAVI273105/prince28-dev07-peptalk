[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peptalk"]

[project]
name = "peptalk"
version = "0.1.0"
description = "Answers modern Python questions using official PEPs and Python What's New documentation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.1.9",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pre-commit",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
