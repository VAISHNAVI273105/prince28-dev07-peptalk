[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peptalk"]

[project]
name = "peptalk"
version = "0.1.0"
description = "Answers modern Python questions using official PEPs and Python What's New documentation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PEPTalk Engineering Team" }]
keywords = ["python", "pep", "cpython", "fastapi", "documentation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.1.9",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "pypdf>=7.1.1",
    "pymupdf>=1.26,<2",
    "trafilatura>=2.4.0",
]

[project.urls]
Repository = "https://github.com/VAISHNAVI273105/prince28-dev07-peptalk"
Issues = "https://github.com/VAISHNAVI273105/prince28-dev07-peptalk/issues"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "poethepoet>=0.31.0",
]
test = [
    "pytest",
    "httpx",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.24.0",
]
lint = [
    "ruff",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["peptalk"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.poe.tasks]
test = "pytest"
test-unit = "pytest tests/unit"
test-integration = "pytest tests/integration"
test-cov = "pytest --cov=peptalk --cov-report=term-missing"
cov = "pytest --cov=peptalk --cov-report=term-missing"
lint = "ruff check ."
format = "ruff format ."
check = ["lint", "test"]
up = "docker compose up -d"
down = "docker compose down"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RSE", "ISC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
