services:
  api:
    build:
      context: .
      target: runtime
    image: peptalk-api:local
    container_name: peptalk-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://peptalk:peptalk_dev_password@db:5432/peptalk
      DATA_FILE: /app/data/sample_records.json
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn peptalk.api.main:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: peptalk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: peptalk
      POSTGRES_USER: peptalk
      POSTGRES_PASSWORD: peptalk_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U peptalk -d peptalk
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: peptalk-redis
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  test-db:
    image: postgres:16-alpine
    container_name: peptalk-test-db
    profiles:
      - test
    environment:
      POSTGRES_DB: peptalk_test
      POSTGRES_USER: peptalk_test
      POSTGRES_PASSWORD: peptalk_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U peptalk_test -d peptalk_test
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
